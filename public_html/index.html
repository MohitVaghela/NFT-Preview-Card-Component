<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equilibrium NFT Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./src/style.css">
</head>

<body>
    <main class="card container-fluid min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card-wrapper">
            <div class="card__images">
                <img src="./assets/image-equilibrium.jpg" alt="Equilibrium NFT" class="img-fluid">
                <div class="card__images-layer">
                    <img src="./assets/icon-view.svg" alt="View NFT">
                </div>
            </div>
            <div class="card__title mt-4">
                <h1>
                    Equilibrium #3429
                </h1>
                <p>
                    Our Equilibrium collection promotes
                    balance and calm.
                </p>
            </div>
            <div class="card__time d-flex justify-content-between align-items-center mt-4">
                <div class="card__time-left d-flex align-items-center gap-2">
                    <img src="./assets/icon-ethereum.svg" alt="Ethereum">
                    <span>
                        0.041 ETH
                    </span>
                </div>
                <div class="card__time-right d-flex align-items-center gap-2">
                    <img src="./assets/icon-clock.svg" alt="Clock">
                    <span>
                        3 days left
                    </span>
                </div>
            </div>
            <div class="card__creator d-flex align-items-center gap-3 mt-4 pt-3">
                <img src="./assets/image-avatar.avif" alt="Creator">
                <p class="mb-0">Creation of <a href="#">Mohit Vaghela</a></p>
            </div>
        </div>
    </main>
    <footer class="attribution text-center">
        Challenge by
        <a href="https://www.crio.do" target="_blank" rel="noopener noreferrer">Crio.</a>Coded by<a
            href="https://github.com/MohitVaghela/NFT-Preview-Card-Component" target="_blank" rel="noopener noreferrer">
            Mohit Vaghela
        </a>
    </footer>
</body>

</html>
